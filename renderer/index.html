<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fabula</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <h1>Fabula</h1>
      <p class="tagline">Raw footage in. A told story out.</p>
    </header>
    <nav class="stages" aria-label="Pipeline stages">
      <span class="stage is-active">Ingest</span>
      <span class="stage">Cut</span>
      <span class="stage">Compose</span>
    </nav>
    <section class="dropzone" id="dropzone">
      <p>Drop a recording here to begin.</p>
      <p class="hint">Transcription, cut proposals, and the review editor arrive in slice 1.</p>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
