<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="normal" />
  <!-- A motion scene runs here, in a sandboxed frame with an opaque origin:
       nothing it does reaches the window, the disk or the network. Everything
       it loads comes over fabula-motion:, which serves an allowlist
       (electron/motion-protocol.cjs). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' fabula-motion:; style-src 'unsafe-inline' fabula-motion:; img-src fabula-motion: data: blob:; font-src fabula-motion: data:; media-src fabula-motion: blob:; connect-src fabula-motion:; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <link rel="stylesheet" href="../fonts.css" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    /* A transition runs on the wall clock, which a film does not have. */
    *, *::before, *::after { transition: none !important; }
    .word, .char { display: inline-block; }
  </style>
  <script src="runtime.js" defer></script>
</head>
<body></body>
</html>
